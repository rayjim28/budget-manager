{% extends 'base.html' %}{% block content %}<section class="page-intro"><div><div class="overline"><span class="overline-bar"></span> EXPENSE DETAILS</div><h1>{{ expense.item_name }}</h1><p>{{ budget.budget_name }}</p></div><a href="{% url 'expense_edit' budget.pk expense.pk %}" class="primary-button">Edit expense</a></section><div class="panel form-panel"><div class="budget-info-list"><div><small>Amount</small><strong>${{ expense.item_cost }}</strong></div><div><small>Category</small><strong>{{ expense.get_item_category_display }}</strong></div><div><small>Purchase date</small><strong>{{ expense.purchase_date|date:'M j, Y' }}</strong></div></div><div class="card-actions"><a href="{% url 'expense_list' budget.pk %}" class="outline-button">Back to expenses</a></div></div>{% endblock %}
