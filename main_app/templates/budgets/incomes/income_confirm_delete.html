{% extends 'base.html' %}{% block content %}<section class="page-intro"><div><h1>Delete income?</h1><p>This will remove the income record from {{ budget.budget_name }}.</p></div></section><div class="panel form-panel"><p>Are you sure you want to delete <strong>{{ income.name }}</strong> (${{ income.amount }})?</p><form method="post" class="form-actions">{% csrf_token %}<button type="submit" class="outline-button danger">Delete income</button><a href="{% url 'income_list' budget.pk %}" class="outline-button">Cancel</a></form></div>{% endblock %}
